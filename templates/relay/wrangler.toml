# Your own WorldMesh presence relay (README.md). Deployed as-is it serves one
# room per world, with no daily limit. Change the vars here: a deploy replaces
# vars edited in the Cloudflare dashboard with these.
name = "worldmesh-relay"
main = "src/index.ts"
compatibility_date = "2025-06-01"

[vars]
# A room per world, picked from the page's Origin. "off" for named rooms only.
WORLD_ROOMS = "on"
# People at once in one world's room.
MAX_WORLD_PEERS = "16"
# Minutes each world's room may be active per UTC day. "0": no limit.
WORLD_DAILY_MINUTES = "0"
# Worlds exempt from that daily limit, comma-separated: origins, or
# "*.example.net" for every https subdomain. Only matters when the limit is on.
OWN_ORIGINS = ""
# Named rooms (/room/<name>), comma-separated, e.g. "lobby" for a city's own
# lobby. Empty: none.
NAMED_ROOMS = ""
# People at once in one named room.
MAX_ROOM_PEERS = "64"
# Optional secret: BLOCKED_ORIGINS, comma-separated origins to refuse.
#   npx wrangler secret put BLOCKED_ORIGINS

# One Durable Object per room.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed Durable Objects are available on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Per IP and Cloudflare location. Each namespace_id must be unique in your
# Cloudflare account: change these if another Worker there already uses them.
[[ratelimits]]
name = "JOIN_LIMIT"
namespace_id = "2001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "READ_LIMIT"
namespace_id = "2002"
simple = { limit = 60, period = 60 }
