<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Not found — WorldMesh</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://worldmesh.net/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100vh; display: grid; place-items: center;
        font-family: "Urbanist", system-ui, sans-serif;
        background: #000; color: #ccc; text-align: center; padding: 24px;
        -webkit-font-smoothing: antialiased;
      }
      @media (prefers-color-scheme: light) {
        body { background: #fff; color: #222; }
        h1 { color: #111; }
        a { color: #444; }
      }
      h1 { font-size: 22px; font-weight: 600; color: #fff; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.6; margin: 0 0 20px; }
      a { color: #999; text-decoration: none; }
      a:hover { color: #fff; }
      @media (prefers-color-scheme: light) {
        a:hover { color: #000; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>That path is not part of WorldMesh.</p>
      <p><a href="/">← Back to WorldMesh</a></p>
    </main>
  </body>
</html>
