<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Music credits — WorldMesh</title>
    <meta name="description" content="The songs played in the WorldMesh lobby, their artists, licences and original sources." />
    <link rel="canonical" href="https://worldmesh.net/music-credits" />
    <link rel="icon" href="/favicon.webp" type="image/webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* The same page as /about, with one entry per song. */
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; margin: 0; }
      body {
        background: #000; color: #ccc;
        font-family: "Urbanist", system-ui, sans-serif;
        padding: 4vh 20px 80px;
        display: flex; justify-content: center;
        -webkit-font-smoothing: antialiased;
      }
      @media (prefers-color-scheme: light) {
        body { background: #fff; color: #222; }
        a { color: #444; }
      }
      main { max-width: 640px; width: 100%; }
      h1 { font-size: 24px; font-weight: 600; margin: 0 0 8px; color: #fff; }
      @media (prefers-color-scheme: light) { h1 { color: #111; } }
      .back { font-size: 13px; color: #888; text-decoration: none; display: inline-block; margin-bottom: 24px; }
      .back:hover { color: #fff; }
      .tagline { font-size: 15px; color: #888; margin-bottom: 32px; }
      h2 { font-size: 15px; font-weight: 600; margin: 0 0 2px; color: #eee; }
      @media (prefers-color-scheme: light) { h2 { color: #222; } }
      p, ul, ol { font-size: 14px; line-height: 1.7; margin: 0 0 12px; }
      a { color: #999; }
      /* Hide scrollbar on mobile across all browsers (Firefox, Chrome, Safari, Edge) */
      @media (max-width: 600px), (pointer: coarse) {
        html, body { scrollbar-width: none; -ms-overflow-style: none; }
        html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; width: 0; height: 0; background: transparent; }
      }

      .tracks { list-style: none; padding: 0; margin: 0; }
      .track { padding: 18px 0; border-top: 1px solid #333; }
      @media (prefers-color-scheme: light) { .track { border-top-color: #e2e2e2; } }
      .track p { margin: 0; }
      .artist { color: #888; }
      .meta { display: flex; gap: 6px 16px; flex-wrap: wrap; margin-top: 6px; font-size: 13px; }
      .attribution {
        margin-top: 10px; padding-left: 14px; border-left: 2px solid #444;
        font-size: 13px; white-space: pre-line; overflow-wrap: anywhere;
      }
      .note { font-size: 13px; color: #888; margin-top: 6px; }
      nav { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 32px; padding-top: 18px; border-top: 1px solid #444; font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <a class="back" href="/about">← Back to About</a>
      <h1>Music credits</h1>
      <p class="tagline">The songs playing in the WorldMesh lobby. Thank you to everyone who shared them.</p>

      <ol class="tracks" id="tracks" aria-label="Songs"></ol>
      <noscript><p>This list needs JavaScript. Every song is credited in <a href="https://github.com/eliaswillnat/worldmesh/blob/main/apps/hub/src/music/tracks.ts">the source code</a>.</p></noscript>

      <nav aria-label="Learn about WorldMesh">
        <a href="/about">About</a>
        <a href="/protocol">Protocol</a>
        <a href="/build-a-city">Build a city</a>
        <a href="/creators">Connect a world</a>
        <a href="/music-credits" aria-current="page">Music credits</a>
      </nav>
    </main>
    <script type="module" src="/src/music/creditsPage.ts"></script>
  </body>
</html>
