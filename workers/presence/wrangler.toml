name = "worldmesh-presence"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# One Durable Object per room. The hub's walk mode uses the "lobby" room;
# other rooms are free for worlds that want shared presence later.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed Durable Objects are available on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Optional secret (npx wrangler secret put PRESENCE_SECRET):
#   PRESENCE_SECRET   the same value as on worldmesh-auth. With it, a username
#                     is shown only with a valid ticket from
#                     /api/account/presence-ticket; without it, names are
#                     self-reported. See docs/cloudflare-deployment.md, step 5.

# Deploy with:
# cd workers/presence && npx wrangler deploy
