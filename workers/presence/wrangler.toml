name = "worldmesh-presence"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# One Durable Object per room. The hub's walk mode uses the "lobby" room;
# other rooms are free for worlds that want shared presence later.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed Durable Objects are available on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Deploy with:
# cd workers/presence && npx wrangler deploy

# ── Preview (docs/previews.md) ─────────────────────────────────────────────
# A separate script with its own Durable Object rooms, so preview visitors
# never meet production ones. Outside Cloudflare Access (WebSockets cannot
# carry the Access login); it stores nothing.
[env.preview]
name = "worldmesh-presence-preview"
routes = [
  { pattern = "preview-relay.worldmesh.net", custom_domain = true },
]
workers_dev = false

[[env.preview.durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[env.preview.migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
