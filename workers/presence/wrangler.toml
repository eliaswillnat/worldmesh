name = "worldmesh-presence"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# One Durable Object per room. The hub's walk mode uses the "lobby" room;
# other rooms are free for worlds that want shared presence later.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed Durable Objects are available on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Deploy with:
# cd workers/presence && npx wrangler deploy
