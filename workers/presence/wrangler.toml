# The free shared relay for independent worlds: relay.worldmesh.net, and the
# runtime's DEFAULT_PRESENCE_SERVER. World rooms, plus the hub lobby's named
# room (`/room/lobby`). The lobby has its own cap (MAX_ROOM_PEERS, default 64)
# and no daily allowance. Limits: docs/compatibility.md#multiplayer.
# The code is templates/relay, the template anyone deploys as their own relay;
# the vars below are what make this one WorldMesh's.
name = "worldmesh-presence"
main = "../../templates/relay/src/index.ts"
compatibility_date = "2025-06-01"

[vars]
# The hub lobby. World rooms stay origin-keyed and cannot land in this name.
NAMED_ROOMS = "lobby"
# Each world's room may be active this many minutes per UTC day.
WORLD_DAILY_MINUTES = "240"
# WorldMesh's own demo worlds, which WorldMesh pays for: no daily limit.
OWN_ORIGINS = "*.worldmesh.net,https://worldmesh-forest.pages.dev,https://worldmesh-mars.pages.dev,https://worldmesh-city.pages.dev,https://worldmesh-medieval.pages.dev,https://worldmesh-space.pages.dev"
# Secret, kept across deploys: BLOCKED_ORIGINS, comma-separated origins to refuse.
#   npx wrangler secret put BLOCKED_ORIGINS --config workers/presence/wrangler.toml

# One Durable Object per room.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed Durable Objects are available on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Per IP and Cloudflare location. Namespace ids are unique per account:
# 10xx production, 11xx preview; workers/lobby uses x003 and x004.
[[ratelimits]]
name = "JOIN_LIMIT"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "READ_LIMIT"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

# Deploy with:
# cd workers/presence && npx wrangler deploy

# ── Preview (docs/previews.md) ─────────────────────────────────────────────
# A separate script with its own Durable Object rooms, so preview visitors
# never meet production ones. Outside Cloudflare Access (WebSockets cannot
# carry the Access login); it stores nothing.
[env.preview]
name = "worldmesh-presence-preview"
routes = [
  { pattern = "preview-relay.worldmesh.net", custom_domain = true },
]
workers_dev = false

[env.preview.vars]
NAMED_ROOMS = "lobby"
WORLD_DAILY_MINUTES = "240"
OWN_ORIGINS = "*.worldmesh.net"

[[env.preview.durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[env.preview.migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[env.preview.ratelimits]]
name = "JOIN_LIMIT"
namespace_id = "1101"
simple = { limit = 30, period = 60 }

[[env.preview.ratelimits]]
name = "READ_LIMIT"
namespace_id = "1102"
simple = { limit = 60, period = 60 }
