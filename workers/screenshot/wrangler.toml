name = "worldmesh-screenshot"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "SCREENSHOTS"
bucket_name = "worldmesh-screenshots"

[vars]
# Public URL prefix for the R2 bucket (set up a custom domain or use r2.dev)
# e.g. https://screenshots.worldmesh.net
R2_PUBLIC_URL = "https://pub-b622cf770b414a1c9869157e73dab3c1.r2.dev"

# Origins whose pages may read responses from a browser. Cover uploads need
# SCREENSHOT_SECRET.
ALLOWED_ORIGINS = "https://worldmesh.net,https://www.worldmesh.net"

# Required. Server callers (workers/admin) send it as
# Authorization: Bearer <secret>. Set the same value in both places:
#   npx wrangler secret put SCREENSHOT_SECRET                       (here)
#   npx wrangler secret put SCREENSHOT_SECRET --config ../admin/wrangler.toml

# ── Preview (docs/previews.md) ─────────────────────────────────────────────
# Covers for the preview hub, in their own bucket. Deployed by
# scripts/preview.sh, which passes R2_PUBLIC_URL (the bucket's r2.dev URL)
# and sets SCREENSHOT_SECRET.
[env.preview]
name = "worldmesh-screenshot-preview"

[[env.preview.r2_buckets]]
binding = "SCREENSHOTS"
bucket_name = "worldmesh-screenshots-preview"

[env.preview.vars]
R2_PUBLIC_URL = ""
ALLOWED_ORIGINS = "https://preview.worldmesh.net"

