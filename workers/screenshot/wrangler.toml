name = "worldmesh-screenshot"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[browser]
binding = "BROWSER"

[[r2_buckets]]
binding = "SCREENSHOTS"
bucket_name = "worldmesh-screenshots"

[vars]
# Public URL prefix for the R2 bucket (set up a custom domain or use r2.dev)
# e.g. https://screenshots.worldmesh.net
R2_PUBLIC_URL = ""

# Set secrets in Cloudflare with:
# npx wrangler secret put SCREENSHOT_SECRET
